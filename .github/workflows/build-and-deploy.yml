name: Build & Deploy

on:
  schedule:
    - cron: "0 * * * *"

  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # 👇 Build steps
      # Reads the pnpm version from `packageManager` in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # If the ecosyste.ms API fails, skip the deploy and keep the last good site live.
      - name: Run Prebuild Script
        id: prebuild
        run: pnpm prebuild
        continue-on-error: true

      - name: Warn about skipped deploy
        if: steps.prebuild.outcome != 'success'
        run: echo "::warning::Prebuild failed (ecosyste.ms API?), so this run did not deploy."

      - name: Build the Project
        if: steps.prebuild.outcome == 'success'
        env:
          NODE_ENV: "production"
        run: pnpm build

      # 👆 Build steps

      # 👇 Deploy steps
      - name: Setup Pages
        if: steps.prebuild.outcome == 'success'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload artifact
        if: steps.prebuild.outcome == 'success'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # 👇 Specify build output path
          path: out

      - name: Deploy to GitHub Pages
        if: steps.prebuild.outcome == 'success'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        # 👆 Deploy steps
