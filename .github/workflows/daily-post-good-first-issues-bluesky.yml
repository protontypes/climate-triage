name: Daily Post Good First Issues to BlueSky

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *" # Runs daily at 12:00 PM UTC

permissions: {}

jobs:
  prepare_posts:
    runs-on: ubuntu-latest
    outputs:
      posts: ${{ steps.build.outputs.posts }}
      count: ${{ steps.build.outputs.count }}
    steps:
      - name: Fetch Good First Issues
        run: |
          set -euo pipefail
          if ! curl -fsSL "https://ost.ecosyste.ms/api/v1/issues?recent=true" -o issues.json; then
            echo "Failed to fetch issues API. Exiting with failure."
            exit 1
          fi
          if ! jq empty issues.json; then
            echo "issues.json is not valid JSON. Exiting with failure."
            exit 1
          fi
          echo "Fetched $(jq length issues.json) issues."

      - name: Prepare Posts
        id: build
        env:
          POST_INTRO: "A new good first issue available for contribution: "
          default_hashtags: " #climate #sustainability #opensource #opensustain #goodfirstissue #goodfirstissues"
        run: |
          set -euo pipefail
          # Keep the full message within the Bluesky 300-character limit by
          # trimming the title; the issue URL and hashtags are never cut.
          jq -c --arg intro "$POST_INTRO" --arg hashtags "$default_hashtags" '
            [.[] | select(.labels[] | if type == "object" then .name else . end == "good first issue")
            | (.project.language // "unknown") as $lang
            | (.project.name // "unknown") as $name
            | .html_url as $url
            | (" (" + $lang + ") - " + $name + " ") as $middle
            | (280 - (($intro + $middle + $url + $hashtags) | length)) as $budget
            | { text: ($intro + .title[0:(if $budget > 10 then $budget else 10 end)] + $middle + $url + $hashtags), url: $url }
          ]' issues.json > posts.json

          count=$(jq length posts.json)
          echo "Prepared $count posts:"
          cat posts.json
          echo "posts=$(jq -c . posts.json)" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"

  post_to_bluesky:
    needs: prepare_posts
    if: needs.prepare_posts.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        post: ${{ fromJson(needs.prepare_posts.outputs.posts) }}
    steps:
      # Facets (clickable links) and the link preview card are handled by the
      # action, like the event-driven post-good-first-issues-mastodon-bluesky
      # workflow. Sequential posting stays within rate limits.
      - name: Send post to Bluesky
        uses: myConsciousness/bluesky-post@2d132869a6a51dea18183a26984a09f67744417e # v6
        with:
          text: ${{ matrix.post.text }}
          link-preview-url: ${{ matrix.post.url }}
          identifier: ${{ secrets.BLUESKY_IDENTIFIER }}
          password: ${{ secrets.BLUESKY_PASSWORD }}
