name: Post Good First Issues to Bluesky and Mastodon
on:
  issues:
    types:
      - labeled

permissions: {}

jobs:
  post_good_first_issue:
    runs-on: ubuntu-latest
    if: contains(github.event.label.name, 'good first issue')
    steps:
      # The title goes through env, never `${{ }}` inside `run`: whoever opens the issue
      # controls it, and interpolating it into the script would run it as shell.
      - name: Prepare Post
        env:
          default_hashtags: " #climate #sustainability #opensource #opensustain #goodfirstissue #goodfirstissues"
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
        run: |
          # Flatten newlines so the title can't write extra lines into $GITHUB_ENV.
          issue_title=$(printf '%s' "$ISSUE_TITLE" | tr '\r\n' '  ')
          echo "post_message=$issue_title $ISSUE_URL $default_hashtags" >> "$GITHUB_ENV"

      - name: Send post to Bluesky
        id: bluesky_post
        uses: myConsciousness/bluesky-post@2d132869a6a51dea18183a26984a09f67744417e # v6
        with:
          text: |
            A new good first issue available for contribution: 
            ${{ env.post_message }}
          identifier: ${{ secrets.BLUESKY_IDENTIFIER }}
          password: ${{ secrets.BLUESKY_PASSWORD }}

      - name: Send post to Mastodon
        id: mastodon_post
        uses: cbrgm/mastodon-github-action@5939c6e084a12d79415a1e7637a6dbf6de241ab1 # v2.2.5
        with:
          message: |
            A new good first issue available for contribution: 
            ${{ env.post_message }}
          url: ${{ secrets.MASTODON_URL }}
          access-token: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          visibility: "public"