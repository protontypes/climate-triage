name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR supersedes the previous run, so cancel it rather than queue.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # One job so dependencies are installed once; the checks themselves take seconds.
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in package.json.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - id: install
        run: pnpm install --frozen-lockfile

      # Fix locally with `pnpm lint:fix`.
      - run: pnpm lint

      # The checks below still run when an earlier one fails, so a PR sees every
      # failure in one go, but not when the install itself failed.
      # Typecheck needs no `pnpm prebuild`: types/data-json.d.ts types the generated data file.
      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm typecheck

      - if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pnpm test
