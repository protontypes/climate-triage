name: Build

on:
  pull_request:
    branches: [main]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

# Its own group per ref: sharing the "pages" group with Fetch & Deploy made PR builds
# queue behind, and be dropped by, production deploys.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Reads the pnpm version from `packageManager` in package.json.
      - name: Install pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # Builds from the committed sample instead of the ecosyste.ms API, so PRs don't
      # send it requests. Live data is still built hourly by Fetch & Deploy.
      - name: Run Prebuild Script
        run: pnpm prebuild:sample

      - name: Build the Project
        env:
          NODE_ENV: "production"
        run: pnpm build
