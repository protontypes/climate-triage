name: Daily Post Good First Issues to Mastodon

on:
  workflow_dispatch:
  schedule:
    - cron: "0 12 * * *" # Runs daily at 12:00 PM UTC

jobs:
  post_good_first_issue:
    runs-on: ubuntu-latest
    steps:
      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Fetch Good First Issues
        id: fetch_issues
        run: |
          set -euo pipefail
          if ! curl -fsSL "https://ost.ecosyste.ms/api/v1/issues?recent=true" -o issues.json; then
            echo "Failed to fetch issues API. Exiting with failure."
            exit 1
          fi
          if ! jq empty issues.json; then
            echo "issues.json is not valid JSON. Exiting with failure."
            exit 1
          fi
          echo "Fetched $(jq length issues.json) issues."

      - name: Check if there are issues
        id: check_issues
        run: |
          count=$(jq length issues.json)
          echo "issues.json contains $count records."
          if [[ ! -s issues.json ]] || [[ "$count" -eq 0 ]]; then
            echo "No issues found. Exiting."
            exit 0
          fi
          echo "Issues found. Proceeding."

      - name: Prepare Posts
        env:
          default_hashtags: " #climate #sustainability #opensource #opensustain #goodfirstissue #goodfirstissues"
        run: |
          jq -c '[.[] | select(.labels[] | if type == "object" then .name else . end == "good first issue") | {project_name: (.project.name // "unknown"), title, language: (.project.language // "unknown"), html_url}]' issues.json > posts.json

          echo "Prepared $(jq length posts.json) posts:"
          cat posts.json

      - name: Check if there are posts
        run: |
          if [[ ! -s posts.json ]] || [[ "$(jq length posts.json)" -eq 0 ]]; then
            echo "No posts to send. Exiting."
            exit 0
          fi
          echo "Posts found. Proceeding."

      - name: Send posts to Mastodon
        env:
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
          default_hashtags: " #climate #sustainability #opensource #opensustain #goodfirstissue #goodfirstissues"
        run: |
          jq -c '.[]' posts.json | while read -r post; do
            project_name=$(echo "$post" | jq -r '.project_name')
            title=$(echo "$post" | jq -r '.title')
            language=$(echo "$post" | jq -r '.language')
            html_url=$(echo "$post" | jq -r '.html_url')
            post_message="$title ($language) - $project_name $html_url $default_hashtags"

            echo "Sending to Mastodon..."
            curl -fsSL -X POST "${MASTODON_URL}/api/v1/statuses" \
              -H "Authorization: Bearer $MASTODON_ACCESS_TOKEN" \
              --data-urlencode "status=A new good first issue available for contribution: $post_message" \
              --data-urlencode "visibility=public"
          done
