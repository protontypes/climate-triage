name: Daily Post Good First Issues to Mastodon

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Select the issues and report them, without posting them.
        type: boolean
        default: false
  schedule:
    - cron: "0 12 * * *" # Runs daily at 12:00 PM UTC

permissions:
  contents: read

# A run that is still posting waits for the other one, so the state of the
# posted issues is not overwritten.
concurrency:
  group: daily-post-good-first-issues-mastodon
  cancel-in-progress: false

env:
  # The uuids of the issues that were posted, one state file per platform.
  STATE_PATH: .so-me-state/posted.json
  CACHE_PREFIX: so-me-posted-mastodon

jobs:
  post_good_first_issues:
    runs-on: ubuntu-latest
    # A run that waits for the API does not have to hold the concurrency group
    # for hours.
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Select the posts
        id: select
        uses: ./.github/actions/select-good-first-issues
        with:
          state-path: ${{ env.STATE_PATH }}
          cache-prefix: ${{ env.CACHE_PREFIX }}

      - name: Report the dry run
        if: ${{ inputs.dry_run }}
        run: |
          echo "::notice::Dry run: the selected issues are not posted."
          echo "Dry run: the selected issues are not posted." >> "$GITHUB_STEP_SUMMARY"

      - name: Send the posts to Mastodon
        if: ${{ !inputs.dry_run }}
        env:
          MASTODON_URL: ${{ secrets.MASTODON_URL }}
          MASTODON_ACCESS_TOKEN: ${{ secrets.MASTODON_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p posted
          while IFS= read -r post; do
            uuid=$(jq -r '.uuid' <<<"$post")
            text=$(jq -r '.text' <<<"$post")
            # Mastodon creates a link preview for the issue url in the status.
            # The idempotency key keeps it from posting the same status twice.
            if curl -fsS -X POST "${MASTODON_URL}/api/v1/statuses" \
              -H "Authorization: Bearer $MASTODON_ACCESS_TOKEN" \
              -H "Idempotency-Key: $uuid" \
              --data-urlencode "status=$text" \
              --data-urlencode "visibility=public" >/dev/null; then
              echo "Posted $uuid to Mastodon."
              printf '%s\n' "$uuid" >"posted/$uuid.txt"
            else
              echo "::warning::Could not post $uuid to Mastodon, it is tried again on the next run."
            fi
          done < <(jq -c '.[]' posts.json)

      # Only a post that succeeded is recorded, a failed one is tried again on
      # the next run. The reservations of a dry run are released as well, so
      # the issues are selected again by the next run.
      - name: Record the posted issues
        uses: ./.github/actions/record-good-first-issues
        with:
          state-path: ${{ env.STATE_PATH }}
          cache-prefix: ${{ env.CACHE_PREFIX }}
          selection: ${{ steps.select.outputs.posts }}
